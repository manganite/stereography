name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js tests/*.mjs; do node --check "$f"; done
      - name: Tests (Punktgruppen, Formenkatalog, Beispiele, Release-Konsistenz)
        run: node --test tests/*.test.mjs
