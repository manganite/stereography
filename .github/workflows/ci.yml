name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js lib/common/js/*.js sw.js tests/*.mjs tools/*.mjs tools/common/*.mjs; do node --check "$f"; done
      - name: Tests (Punktgruppen, Formenkatalog, Beispiele, Quiz, Release-Konsistenz, gemeinsame Dateien)
        run: node --test tests/*.test.mjs

  # Typprüfung (LEITFADEN.md, Abschn. 9). TypeScript nur hier, die Tests bleiben ohne Abhängigkeiten.
  # Lokal dieselben Pakete in einem Befehl installieren (ein zweites npm install --no-save entfernt die ersten).
  typen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript und ESLint
        run: npm install --no-save typescript@7.0.2 @types/node@22.20.5 playwright@1.52.0 @types/three@0.186.0 eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0
      - name: Typen prüfen
        run: npx tsc -p .

  # ESLint (LEITFADEN.md von crystallography-common, Abschn. 9), Regeln in tools/common/eslint-basis.mjs.
  # Dieselben Pakete wie bei „typen“, damit tsc auch die Konfiguration prüft.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ESLint
        run: npm install --no-save typescript@7.0.2 @types/node@22.20.5 playwright@1.52.0 @types/three@0.186.0 eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0
      - name: ESLint
        run: npx eslint .

  # PDF-Fassung des Skripts wie bei Deploy und Release, damit Fehler vor dem Tag auffallen
  pdf:
    # Playwright 1.52 kennt die Systempakete von Ubuntu 24.04; ubuntu-latest wechselt auf Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          # ohne --with-deps: kein apt (Ausfall der Ubuntu-Paketquellen 11.11.2026, crystallography-common#128); die Bibliotheken sind auf dem Runner
          npx playwright install chromium
      - name: Skript als PDF
        run: node tools/skript-pdf.mjs skript.pdf
      - name: Schriften im PDF (vorübergehend, crystallography-common#128)
        run: |
          pip install --quiet pypdf
          python3 -c "
          import pypdf, collections
          r = pypdf.PdfReader('skript.pdf'); c = collections.Counter()
          for pg in r.pages:
              fs = (pg.get('/Resources') or {}).get('/Font') or {}
              for f in fs.values(): c[str(f.get_object().get('/BaseFont'))] += 1
          print('Seiten', len(r.pages))
          for k, v in c.most_common(): print(v, k)
          "
          fc-list : family | sort -u
      - name: PDF als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: skript-pdf
          path: skript.pdf
