name: CodeQL

# Erweiterte Einrichtung statt der Standardeinrichtung, damit Tests und Fremdcode nicht geprüft
# werden (.github/codeql/codeql-config.yml). Die Standardeinrichtung muss dafür aus sein.
on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: CodeQL einrichten
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analysieren
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
