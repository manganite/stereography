name: Deploy to GitHub Pages

# Die Live-Seite wird nur bei einem Release-Tag aktualisiert: main kann geprüfte
# Änderungen sammeln, das Veröffentlichen ist ein bewusster Schritt.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Ubuntu 24.04 wegen Playwright 1.52 (Skript-PDF); ubuntu-latest wechselt auf Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Auch bei manuellem Start nur von einem Release-Tag, der zu js/version.js passt
      # (sonst trüge unveröffentlichter Stand dieselbe Offline-Cache-Version).
      - name: Validate tag against js/version.js
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Veröffentlichung nur von einem Tag vX.Y.Z (hier: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})."
            exit 1
          fi
          APP=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" js/version.js)
          if [ "v${APP}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu js/version.js (${APP})."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html skript.html quiz.html manifest.webmanifest sw.js LICENSE js lib icons _site/
      # PDF-Fassung des Skripts (tools/skript-pdf.mjs), verlinkt im Kopf des Skripts
      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Skript als PDF
        continue-on-error: true
        run: node tools/skript-pdf.mjs _site/skript.pdf
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
