name: Release

# Ein Tag vX.Y.Z erzeugt das GitHub-Release; die Notizen stammen aus dem
# passenden Abschnitt von CHANGELOG.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tag against js/version.js
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' ist kein Semver-Tag (vX.Y.Z)."
            exit 1
          fi
          APP=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" js/version.js)
          if [ "v${APP}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu js/version.js (${APP})."
            exit 1
          fi
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[.*\]:/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Siehe CHANGELOG.md."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
